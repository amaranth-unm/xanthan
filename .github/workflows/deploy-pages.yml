name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create analytics overlay config (optional)
        id: analytics_config
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [[ -n "$GA_MEASUREMENT_ID" ]]; then
            echo "analytics_id: $GA_MEASUREMENT_ID" > _config.analytics.yml
            echo "config_files=_config.yml,_config.analytics.yml" >> "$GITHUB_OUTPUT"
            echo "Analytics overlay enabled"
          else
            echo "config_files=_config.yml" >> "$GITHUB_OUTPUT"
            echo "No GA_MEASUREMENT_ID secret found; building without analytics"
          fi

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config ${{ steps.analytics_config.outputs.config_files }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
