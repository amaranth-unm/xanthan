name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create CI overlay config
        id: ci_config
        env:
          REPOSITORY_NWO: ${{ github.repository }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          {
            echo "repository: $REPOSITORY_NWO"
            if [[ -n "$GA_MEASUREMENT_ID" ]]; then
              echo "analytics_id: $GA_MEASUREMENT_ID"
            fi
          } > _config.ci.yml

          echo "config_files=_config.yml,_config.ci.yml" >> "$GITHUB_OUTPUT"

          if [[ -n "$GA_MEASUREMENT_ID" ]]; then
            echo "CI overlay created with repository + analytics"
          else
            echo "CI overlay created with repository only (no analytics secret found)"
          fi

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --config ${{ steps.ci_config.outputs.config_files }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
